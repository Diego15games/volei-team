name: Gerar APK Volei Team

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Cordova e compilar APK
        run: |
          npm install -g cordova
          mkdir app_build
          cp -r www app_build/
          cp config.xml app_build/
          cd app_build
          cordova platform add android
          cordova plugin add cordova-plugin-bluetooth-serial
          cordova build android

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: VoleiTeam-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
